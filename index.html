    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QR Code Generator",
        "url": "https://qr-generator.correia95.workers.dev/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Generate static QR codes for links, Wi-Fi, email, SMS, phone and contact cards, with PNG and SVG download. Runs entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is this QR code generator really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. There is no sign-up, no watermark and no limit. The QR code is generated in your browser and you can download it as a PNG or SVG."
            }
          },
          {
            "@type": "Question",
            "name": "Do the QR codes expire?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. These are static QR codes — the information is encoded directly in the pattern, so they keep working forever and are not tracked. Only paid 'dynamic' QR codes, which encode a redirect link, can expire."
            }
          },
          {
            "@type": "Question",
            "name": "How do I make a QR code for my Wi-Fi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Choose the Wi-Fi tab, enter the network name and password and pick the security type. Scanning the resulting code with a phone camera prompts it to join the network. This works on iOS 11 and later and Android 10 and later."
            }
          },
          {
            "@type": "Question",
            "name": "Which error correction level should I use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Medium (15%) is a good default. Use High (30%) if the code will be small, printed on something that flexes, partly covered, or has a logo in the middle."
            }
          }
        ]
      }
    </script>
